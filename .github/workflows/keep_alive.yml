name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 12 minutes (Render free tier goes to sleep after 15 min of silence)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" https://clove-jqb3.onrender.com/docs)
          echo "Render endpoint responded with HTTP status: $response"
